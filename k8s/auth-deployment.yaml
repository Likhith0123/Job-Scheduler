apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: chronoflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: chronoflow/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: chronoflow-config
            - secretRef:
                name: chronoflow-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: chronoflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 8080
      targetPort: 8080
