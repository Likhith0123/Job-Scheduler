apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: chronoflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-service
  template:
    metadata:
      labels:
        app: scheduler-service
    spec:
      containers:
        - name: scheduler-service
          image: chronoflow/scheduler-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: chronoflow-config
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-service
  namespace: chronoflow
spec:
  selector:
    app: scheduler-service
  ports:
    - port: 8080
      targetPort: 8080
