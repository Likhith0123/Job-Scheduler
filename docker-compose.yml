services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronoflow
      POSTGRES_USER: chronoflow
      POSTGRES_PASSWORD: chronoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronoflow -d chronoflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - job-service
      - scheduler-service
      - executor-service
      - gateway-service

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chronoflow
      POSTGRES_USER: chronoflow
      POSTGRES_PASSWORD: chronoflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  job-service:
    build:
      context: .
      args:
        MODULE: job-service
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chronoflow
      POSTGRES_USER: chronoflow
      POSTGRES_PASSWORD: chronoflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler-service:
    build:
      context: .
      args:
        MODULE: scheduler-service
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JOB_SERVICE_URL: http://job-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8083:8080"
    depends_on:
      kafka:
        condition: service_healthy
      job-service:
        condition: service_started

  executor-service:
    build:
      context: .
      args:
        MODULE: executor-service
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JOB_SERVICE_URL: http://job-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8084:8080"
    depends_on:
      kafka:
        condition: service_healthy
      job-service:
        condition: service_started

  python-executor-service:
    build:
      context: ./python-executor-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JOB_SERVICE_URL: http://job-service:8080
      PYTHON_EXECUTION_TIMEOUT_SEC: 30
      PYTHON_SCRIPTS_DIR: /app/scripts
    depends_on:
      kafka:
        condition: service_healthy
      job-service:
        condition: service_started

  gateway-service:
    build:
      context: .
      args:
        MODULE: gateway-service
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8080
      JOB_SERVICE_URL: http://job-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      job-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_AUTH_URL: http://localhost:8081
    ports:
      - "3001:80"
    depends_on:
      - gateway-service
      - auth-service

volumes:
  postgres_data:
  grafana_data:
