global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: job-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["job-service:8080"]

  - job_name: scheduler-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["scheduler-service:8080"]

  - job_name: executor-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["executor-service:8080"]
